<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>105.5 FM — La Radio de la Gente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
        }

        body {
            background: linear-gradient(135deg, #0a0e27, #1a1f3a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        /* === REPRODUCTOR === */
        .player {
            background: linear-gradient(180deg, #1e2240, #14172b);
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            color: #fff;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .station-name {
            font-size: clamp(22px, 6vw, 28px);
            font-weight: 800;
            color: #00ff88;
            letter-spacing: 1px;
        }

        .live-badge {
            background: linear-gradient(90deg, #ff3333, #ff6666);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .tagline {
            text-align: center;
            font-size: clamp(16px, 5vw, 19px);
            color: #ff0000;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .visualizer-container {
            background: #0f1223;
            border-radius: 12px;
            padding: 15px 10px;
            margin-bottom: 15px;
            height: 120px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            overflow: hidden;
        }

        .bar {
            width: 8px;
            max-width: 6px;
            background: linear-gradient(180deg, #00ff88, #ffcc00, #ff3333);
            border-radius: 3px 3px 0 0;
            animation: equalize 0.6s ease-in-out infinite alternate;
        }

        @keyframes equalize {
            0% { height: 15%; }
            100% { height: 90%; }
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .play-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            transition: transform 0.15s ease;
            flex-shrink: 0;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
            min-width: 140px;
        }

        .volume-label {
            font-size: 13px;
            color: #99a8cc;
            white-space: nowrap;
        }

        input[type="range"] {
            width: 100%;
            max-width: 130px;
            height: 8px;
            border-radius: 4px;
            background: #2a2f4f;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #00ff88;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,255,136,0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #00ff88;
            border: none;
            cursor: pointer;
        }

        .status-text {
            text-align: center;
            font-size: 13px;
            color: #8899aa;
            margin-top: 12px;
            min-height: 20px;
        }

        .status-text.playing {
            color: #00ff88;
        }

        /* === INFORMACIÓN INFERIOR === */
        .info-text {
            margin-top: 25px;
            text-align: center;
            color: #cad0e8;
            line-height: 1.6;
        }

        .info-text h2 {
            font-size: 18px;
            color: #00ff88;
            margin-bottom: 10px;
        }

        .info-text p {
            font-size: 14px;
            color: #b0b8d4;
        }

        .developer {
            margin-top: 15px;
            font-size: 13px;
            color: #7c88b0;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .fmlabel {
            color: #00ff88;
            font-weight: bold;
        }

        audio { display: none; }
    </style>
</head>
<body>

    <!-- REPRODUCTOR -->
    <div class="player">
        <div class="player-header">
            <div class="station-name">105.5 FM</div>
            <div class="live-badge"><span class="live-dot"></span> EN LÍNEA</div>
        </div>

        <div class="tagline">La Radio de la Gente</div>

        <div class="visualizer-container" id="bars"></div>

        <div class="controls-bar">
            <button class="play-btn" id="playBtn">▶</button>
            <div class="volume-container">
                <span class="volume-label">Volumen</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="80">
            </div>
        </div>

        <div class="status-text" id="statusText">Toca ▶ para escuchar</div>

        <audio id="radioPlayer" preload="none">
            <source src="http://uk14freenew.listen2myradio.com:32610/;stream.mp3" type="audio/mpeg">
            <source src="http://uk14freenew.listen2myradio.com:32610/stream" type="audio/mpeg">
            <source src="http://radiolitoral1055.radio12345.com:32610/;stream.mp3" type="audio/mpeg">
        
    </div>

    <!-- INFORMACIÓN Y FIRMA -->
    <div class="info-text">
        <h2>Somos tu Radio</h2>
        <p>Desde Gral. Manuel Belgrano — Departamento Patiño<br>Provincia de Formosa</p>
        <div class="developer">
            <span>Desarrollador: Fabricio Caballero</span>
            <span class="fmlabel">| FM LITORAL</span>
        </div>
    </div>

    <script>
        // Visualizador animado
        const container = document.getElementById('bars');
        const barCount = 24;
        const bars = [];
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.classList.add('bar');
            bar.style.animationDelay = `${Math.random() * 0.6}s`;
            container.appendChild(bar);
            bars.push(bar);
        }
        setInterval(() => {
            bars.forEach(bar => bar.style.height = `${Math.random() * 75 + 15}%`);
        }, 600);

        // Reproducción
        const audio = document.getElementById('radioPlayer');
        const playBtn = document.getElementById('playBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const statusText = document.getElementById('statusText');
        audio.volume = 0.8;

        playBtn.addEventListener('click', async () => {
            try {
                if (audio.paused) {
                    statusText.textContent = '🔄 Conectando...';
                    playBtn.disabled = true;
                    await audio.play();
                    playBtn.textContent = '⏸';
                    statusText.textContent = '✅ En reproducción';
                    statusText.classList.add('playing');
                } else {
                    audio.pause();
                    playBtn.textContent = '▶';
                    statusText.textContent = 'Toca ▶ para escuchar';
                    statusText.classList.remove('playing');
                }
            } catch (err) {
                statusText.textContent = '⚠️ Abrir en nueva pestaña';
                statusText.style.color = '#ff6666';
                if (confirm('No se pudo reproducir directamente. ¿Abrir el stream?')) {
                    window.open('http://uk14freenew.listen2myradio.com:32610/;stream.mp3', '_blank');
                }
            } finally {
                playBtn.disabled = false;
            }
        });

        volumeSlider.addEventListener('input', e => audio.volume = e.target.value / 100);
    </script>

</body>
</html>
